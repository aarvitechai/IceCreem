<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600"><style>
.float{animation:float 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.shadow{animation:shadow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle{animation:twinkle 2.6s ease-in-out infinite}
.fall{animation:fall 7s linear infinite}
.drip{animation:drip 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:top}
.glow{animation:glow 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(-1.5deg)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.28}50%{transform:scale(.86);opacity:.18}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fall{0%{transform:translateY(-80px)}100%{transform:translateY(820px)}}
@keyframes drip{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.25)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
