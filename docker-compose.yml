# Full stack: SQL Server, .NET API, Next.js web and Nginx.
#   cp .env.example .env    (then set strong values)
#   docker compose up -d --build
#   open http://localhost:8080

name: icecream

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MSSQL_PID: Express
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Server=db;Database=IceCreamDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Database__MigrateOnStartup: "true"
      Seed__DefaultPassword: ${SEED_PASSWORD:-}
      Api__EnableDocs: ${API_DOCS:-false}
    volumes:
      - uploads:/app/wwwroot/uploads

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8080
        NEXT_PUBLIC_SHOW_DEMO_LOGINS: ${SHOW_DEMO_LOGINS:-false}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
  uploads:
