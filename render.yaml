# Render Blueprint: free environment for Desired Ice Cream.
# Creates the .NET API and the Next.js website from the production branch.
# The database is a free Neon PostgreSQL (no expiry), connected by its connection string.
# Guide: docs/deploy-render.md

services:
  - type: web
    name: desiredicecream-api
    runtime: docker
    plan: free
    region: singapore
    branch: production
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    # Deploy only after the GitHub CI checks for the commit pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: Database__Provider
        value: Postgres
      - key: Database__MigrateOnStartup
        value: "true"
      # Asked once when you create the Blueprint. Paste the Neon connection string
      # (postgresql://...neon.tech/neondb?sslmode=require).
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Key
        generateValue: true
      # Asked once when you create the Blueprint. First password of the starter admin users.
      - key: Seed__DefaultPassword
        sync: false

  - type: web
    name: desiredicecream-web
    runtime: docker
    plan: free
    region: singapore
    branch: production
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /about
    # Deploy only after the GitHub CI checks for the commit pass.
    autoDeployTrigger: checksPass
    domains:
      - desiredicecream.redstarvibe.com
    envVars:
      # Public address of the API service above. Change it if Render gives the API a different URL.
      - key: API_INTERNAL_URL
        value: https://desiredicecream-api.onrender.com
      - key: NEXT_PUBLIC_SHOW_DEMO_LOGINS
        value: "false"
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: 0.0.0.0
