name: Deploy to Azure

# Off until you connect Azure. Setup steps: docs/deploy-azure.md, section "Automatic deploys".
# - Push to staging    -> deploys the staging environment
# - Push to production -> deploys the production environment (can require approval)
# - Or run it by hand from the Actions tab.
on:
  push:
    branches: [staging, production]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  id-token: write   # sign in to Azure with OpenID Connect, no stored Azure password
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          APP_ENV: ${{ github.event.inputs.environment || github.ref_name }}
          LOCATION: ${{ vars.AZURE_LOCATION || 'centralindia' }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: bash deploy/azure/deploy.sh
