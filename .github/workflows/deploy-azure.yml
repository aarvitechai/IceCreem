name: Deploy to Azure

# Manual only, so it never adds a check that Render waits on.
# Live and test sites deploy on Render after CI passes (docs/deploy-render.md).
# Use this workflow only if you move to Azure (docs/deploy-azure.md, section "Automatic deploys").
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  id-token: write   # sign in to Azure with OpenID Connect, no stored Azure password
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          APP_ENV: ${{ github.event.inputs.environment }}
          LOCATION: ${{ vars.AZURE_LOCATION || 'centralindia' }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: bash deploy/azure/deploy.sh
