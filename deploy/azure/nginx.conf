# Gateway for Azure Container Apps.
# Same routing as deploy/nginx.conf, with two Azure specific changes:
#   1. Apps are reached by their Container App name on port 80 (internal ingress).
#   2. The Host header must be the target app name, so the Azure ingress can route the call.
# Azure terminates HTTPS before this container, so we forward the original scheme.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

map $http_x_forwarded_proto $real_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

upstream api { server api:80; keepalive 16; }
upstream web { server web:80; keepalive 16; }

server {
  listen 80;
  server_name _;

  client_max_body_size 5m;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  proxy_http_version 1.1;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $real_proto;
  proxy_set_header X-Forwarded-Host $host;

  location /api/ {
    proxy_pass http://api;
    proxy_set_header Host api;
    proxy_set_header Connection "";
  }

  # SignalR needs WebSocket upgrade and long timeouts.
  location /hubs/ {
    proxy_pass http://api;
    proxy_set_header Host api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  location /uploads/ {
    proxy_pass http://api;
    proxy_set_header Host api;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # API docs. The API returns 404 here unless Api__EnableDocs is true (staging only).
  location ~ ^/(scalar|openapi)/ {
    proxy_pass http://api;
    proxy_set_header Host api;
  }

  location /health/ {
    proxy_pass http://api;
    proxy_set_header Host api;
  }

  location /_next/static/ {
    proxy_pass http://web;
    proxy_set_header Host web;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://web;
    proxy_set_header Host web;
    proxy_set_header Connection "";
  }
}
