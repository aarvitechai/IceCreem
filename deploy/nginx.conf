# Single entry point. Browser talks to one origin:
#   /api, /hubs, /uploads  ->  .NET API
#   everything else        ->  Next.js
# Put TLS in front of this (load balancer, Cloudflare, or certbot) for HTTPS.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream api { server api:8080; keepalive 32; }
upstream web { server web:3000; keepalive 32; }

server {
  listen 80;
  server_name _;

  client_max_body_size 5m;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://api;
    proxy_set_header Connection "";
  }

  # SignalR needs WebSocket upgrade and long timeouts.
  location /hubs/ {
    proxy_pass http://api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  location /uploads/ {
    proxy_pass http://api;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location /health/ {
    proxy_pass http://api;
  }

  location /_next/static/ {
    proxy_pass http://web;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://web;
    proxy_set_header Connection "";
  }
}
